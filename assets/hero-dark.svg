<svg xmlns="http://www.w3.org/2000/svg" width="880" height="296" viewBox="0 0 880 296" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Tensorus — The Agentic Tensor Database &amp; Data Lakehouse</title>
  <desc id="hero-desc">Verifiable multidimensional array storage, declared physical and ML semantics, and human-approved AI agent workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071411"/>
      <stop offset="100%" stop-color="#0e2620"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#15362d" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="880" height="296" rx="16" fill="url(#bg)"/>
  <rect width="880" height="296" rx="16" fill="url(#grid)" opacity="0.7"/>
  <rect width="880" height="296" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="878" height="294" rx="15" fill="none" stroke="#245749" stroke-width="1.5"/>

  <!-- Brand Lockup -->
  <g transform="translate(40, 36)">
    <rect width="42" height="42" rx="11" fill="#133b31" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(1, 1)" fill="none" stroke="#86efac" stroke-width="2.2" stroke-linejoin="round">
      <path d="m20 7 12 7v13l-12 7-12-7V14z"/>
      <path d="m8 14 12 7 12-7M20 21v13M14 10l12 7v13"/>
    </g>
    <text x="56" y="18" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.8" fill="#5eead4">TENSORUS</text>
    <text x="56" y="37" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#a7c4b8">Agentic Tensor Platform</text>
  </g>

  <!-- Crisp Large Headline -->
  <text x="40" y="124" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f0fdf4">The Agentic Tensor</text>
  <text x="40" y="166" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f0fdf4">Database &amp; Data Lakehouse</text>

  <text x="40" y="204" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#a7c4b8">Verifiable N-dimensional storage, declared physical &amp; ML semantics,</text>
  <text x="40" y="227" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#a7c4b8">and hash-approved execution for external AI agents.</text>

  <!-- Large Legible Capability Pills -->
  <g transform="translate(40, 246)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#bbf7d0">
    <rect x="0" y="0" width="154" height="30" rx="15" fill="#102e26" stroke="#2b6958" stroke-width="1.2"/>
    <text x="77" y="19.5" text-anchor="middle">Zarr v3 · SHA-256</text>

    <rect x="166" y="0" width="166" height="30" rx="15" fill="#102e26" stroke="#2b6958" stroke-width="1.2"/>
    <text x="249" y="19.5" text-anchor="middle">Axes &amp; Validity</text>

    <rect x="344" y="0" width="168" height="30" rx="15" fill="#102e26" stroke="#2b6958" stroke-width="1.2"/>
    <text x="428" y="19.5" text-anchor="middle">Python SDK · MCP</text>
  </g>

  <!-- Clean Isometric Tensor Visual on Right (pure crisp geometry, zero tiny text!) -->
  <g transform="translate(716, 148)" fill="none" stroke-linejoin="round">
    <polygon points="0,-82 112,-26 0,30 -112,-26" fill="#102e26" stroke="#245749" stroke-width="1.8"/>
    <polygon points="0,-46 112,10 0,66 -112,10" fill="#102e26" stroke="#5eead4" stroke-width="2" stroke-dasharray="6 4"/>

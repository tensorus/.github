    <line x1="-74" y1="27" x2="38" y2="83" stroke="#86efac" stroke-opacity="0.5" stroke-width="1.3"/>
    <line x1="-38" y1="9" x2="74" y2="65" stroke="#86efac" stroke-opacity="0.5" stroke-width="1.3"/>
    <line x1="74" y1="27" x2="-38" y2="83" stroke="#86efac" stroke-opacity="0.5" stroke-width="1.3"/>
    <line x1="38" y1="9" x2="-74" y2="65" stroke="#86efac" stroke-opacity="0.5" stroke-width="1.3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Tensorus — The Agentic Tensor Database &amp; Data Lakehouse</title>
  <desc id="hero-desc">Multidimensional numerical storage with verifiable SHA-256 identity, declared physical and ML semantics, lineage-aware governance, and human-approved agent workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071310"/>
      <stop offset="100%" stop-color="#0d241e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#16352d" stroke-width="0.75"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="20" fill="url(#grid)" opacity="0.75"/>
  <rect width="1280" height="420" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="418" rx="19" fill="none" stroke="#235347" stroke-width="1.5"/>

  <!-- Brand Lockup -->
  <g transform="translate(64, 54)">
    <rect width="48" height="48" rx="13" fill="#12382f" stroke="#86efac" stroke-width="1.5"/>
    <g transform="translate(4, 4)" fill="none" stroke="#86efac" stroke-width="2.2" stroke-linejoin="round">
      <path d="m20 7 12 7v13l-12 7-12-7V14z"/>
      <path d="m8 14 12 7 12-7M20 21v13M14 10l12 7v13"/>
    </g>
    <text x="64" y="21" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2.4" fill="#5eead4">TENSORUS PLATFORM</text>
    <text x="64" y="42" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f0fdf4">Tensorus</text>
  </g>

  <!-- Headline & Value Prop -->
  <text x="64" y="162" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8" fill="#f0fdf4">The Agentic Tensor</text>
  <text x="64" y="214" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8" fill="#f0fdf4">Database &amp; Data Lakehouse</text>

  <text x="64" y="258" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94b8ab">Store N-dimensional arrays with exact SHA-256 identity, physical &amp; ML coordinate</text>
  <text x="64" y="284" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94b8ab">semantics, transitive lineage ACLs, and hash-approved external AI agent execution.</text>

  <!-- Feature Pills -->
  <g transform="translate(64, 324)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#bbf7d0">
    <rect x="0" y="0" width="168" height="34" rx="17" fill="#102d25" stroke="#286152"/>
    <text x="84" y="21" text-anchor="middle">Zarr v3 + NPY I/O</text>

    <rect x="180" y="0" width="192" height="34" rx="17" fill="#102d25" stroke="#286152"/>
    <text x="276" y="21" text-anchor="middle">Typed Axes &amp; Validity</text>

    <rect x="384" y="0" width="168" height="34" rx="17" fill="#102d25" stroke="#286152"/>
    <text x="468" y="21" text-anchor="middle">MCP &amp; Python SDK</text>

    <rect x="564" y="0" width="184" height="34" rx="17" fill="#102d25" stroke="#286152"/>
    <text x="656" y="21" text-anchor="middle">Fenced Cloud Cells</text>
  </g>

  <!-- Right Side Isometric 3D Tensor Lattice + Agent Verification Card -->
  <g transform="translate(830, 48)">
    <rect x="0" y="0" width="386" height="324" rx="16" fill="#0b1f1a" stroke="#235347" stroke-width="1.5" opacity="0.96"/>
    <text x="24" y="34" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1.6" fill="#5eead4">IMMUTABLE TENSOR DESCRIPTOR</text>
    <circle cx="354" cy="30" r="5" fill="#34d399"/>

    <!-- Isometric Layered Tensor Slices -->
    <g transform="translate(193, 134)" fill="none" stroke-linejoin="round">
      <!-- Back slice -->
      <polygon points="0,-64 96,-16 0,32 -96,-16" fill="#102d25" stroke="#235347" stroke-width="1.4"/>
      <!-- Middle slice (validity mask) -->
      <polygon points="0,-38 96,10 0,58 -96,10" fill="#102d25" stroke="#5eead4" stroke-width="1.5" stroke-dasharray="4 3"/>
      <!-- Top canonical tensor slice -->
      <polygon points="0,-12 96,36 0,84 -96,36" fill="#12382f" stroke="#86efac" stroke-width="2"/>
      <!-- Internal tensor grid lines on top slice -->
      <line x1="-64" y1="20" x2="32" y2="68" stroke="#86efac" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="-32" y1="4" x2="64" y2="52" stroke="#86efac" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="64" y1="20" x2="-32" y2="68" stroke="#86efac" stroke-opacity="0.45" stroke-width="1"/>
      <line x1="32" y1="4" x2="-64" y2="52" stroke="#86efac" stroke-opacity="0.45" stroke-width="1"/>
    </g>

    <!-- Metadata / Provenance Spec Box -->
    <rect x="22" y="232" width="342" height="72" rx="10" fill="#102d25" stroke="#286152"/>
    <text x="36" y="254" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f0fdf4">dtype: float32  ·  shape: [1024, 256, 64]</text>
    <text x="36" y="274" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#94b8ab">axes : [time(UTC), lat(deg), band(nm)]</text>
    <text x="36" y="294" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5eead4">plan : sha256:9f4c…e81a  ✓ APPROVED</text>
  </g>
</svg>
